name: iOS Deploy to TestFlight

on:
  push:
    branches:
      - main # mainブランチにプッシュされたら自動起動
  workflow_dispatch: # マニュアル起動を許可
  
jobs:
  deploy:
    # 💡 AppleのiOS 26要件を満たす最新のクラウドMac環境を指定
    runs-on: macos-15

    steps:
      # 1. ソースコードのチェックアウト
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. プライベートリポジトリから証明書（match）を安全にダウンロードするためのSSH設定
      - name: Install SSH Key for Match repo
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.MATCH_GIT_PRIVATE_KEY }}

      # 3. 適切なXcodeバージョンを選択（Apple Store必須のiOS 26 SDKを含むバージョン）
      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer

      # 4. Ruby環境のセットアップ（Bundlerのキャッシュを有効化）
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundle-cache: true

      # 5. 依存関係（FastlaneなどのGem）のインストール
      - name: Install dependencies
        run: bundle install

      # 6. SwiftパッケージとビルドアーティファクトのキャッシュRestoration
      - name: Cache Swift packages
        uses: actions/cache@v3
        with:
          path: |
            .build
            Package.resolved
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      # 7. CocoaPods依存関係のインストール（Podfile.lockとの同期）
      - name: Install CocoaPods dependencies
        run: pod install --repo-update

      # 8. Fastlaneを実行してTestFlightへ配信（並列ビルドを有効化）
      - name: Run Fastlane
        env:
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          # 並列コンパイルを有効化
          SWIFT_COMPILATION_MODE: wholemodule
          OTHER_SWIFT_FLAGS: -j$(sysctl -n hw.logicalcpu)
        run: bundle exec fastlane release_to_app_store
